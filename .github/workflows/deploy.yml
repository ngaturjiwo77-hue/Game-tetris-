name: Deploy Neon Tetris to Pages

on:
  # Berjalan otomatis setiap kali kamu push ke branch main
  push:
    branches: ["main"]

  # Mengizinkan kamu menjalankan workflow secara manual dari tab Actions
  workflow_dispatch:

# Memberikan izin untuk menulis ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Mengunggah seluruh isi repositori (termasuk index.html)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
