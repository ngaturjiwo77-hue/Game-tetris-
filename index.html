<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Tetris Mobile Pro</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --bg-color: #050505;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; /* Full kontrol sentuh */
        }

        .header {
            width: 95vw;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 10vh;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid #333;
            min-width: 80px;
            text-align: center;
        }

        .stat-label { font-size: 10px; color: #888; text-transform: uppercase; }
        .stat-value { font-size: 18px; font-weight: bold; color: var(--neon-blue); }

        /* Board Responsif */
        #tetris {
            background: #000;
            border: 2px solid #222;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
            image-rendering: pixelated; /* Menjaga ketajaman blok */
        }

        .controls {
            width: 100vw;
            height: 25vh;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 15px;
            padding: 15px;
            box-sizing: border-box;
            background: linear-gradient(to top, #000, transparent);
        }

        .btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid #444;
            border-radius: 15px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            background: var(--neon-pink);
            box-shadow: 0 0 15px var(--neon-pink);
            transform: scale(0.92);
        }

        .btn-rotate { grid-column: 2; grid-row: 1; border-color: var(--neon-pink); color: var(--neon-pink); }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        #next { background: #000; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="stat-box">
            <div class="stat-label">Score</div>
            <div id="score" class="stat-value">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Next</div>
            <canvas id="next" width="50" height="50"></canvas>
        </div>
    </div>

    <canvas id="tetris"></canvas>

    <div class="controls">
        <div class="btn btn-rotate" id="ctrl-up">↻</div>
        <div class="btn btn-left" id="ctrl-left">←</div>
        <div class="btn btn-down" id="ctrl-down">↓</div>
        <div class="btn btn-right" id="ctrl-right">→</div>
    </div>

<script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next');
    const nextContext = nextCanvas.getContext('2d');

    // --- OPTIMASI LAYAR ---
    function resize() {
        const padding = 20;
        const availableHeight = window.innerHeight * 0.6; // Pakai 60% tinggi layar
        const ratio = 12 / 20; // Tetris grid 12x20
        
        let newWidth = window.innerWidth - padding;
        let newHeight = newWidth / ratio;

        if (newHeight > availableHeight) {
            newHeight = availableHeight;
            newWidth = newHeight * ratio;
        }

        canvas.width = newWidth;
        canvas.height = newHeight;
        
        // Hitung skala baru (Grid 12x20)
        const scale = newWidth / 12;
        context.setTransform(1, 0, 0, 1, 0, 0); // Reset
        context.scale(scale, scale);
    }
    window.addEventListener('resize', resize);
    resize();

    // --- SISTEM SUARA (Synthesizer) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(freq, type, duration) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    const sounds = {
        move: () => playSound(150, 'square', 0.05),
        rotate: () => playSound(300, 'triangle', 0.1),
        drop: () => playSound(100, 'sine', 0.1),
        clear: () => {
            playSound(400, 'square', 0.2);
            setTimeout(() => playSound(600, 'square', 0.2), 100);
            if (navigator.vibrate) navigator.vibrate(50);
        }
    };

    // --- LOGIKA GAME ---
    function createPiece(type) {
        if (type === 'T') return [[0,0,0],[1,1,1],[0,1,0]];
        if (type === 'O') return [[2,2],[2,2]];
        if (type === 'L') return [[0,3,0],[0,3,0],[0,3,3]];
        if (type === 'J') return [[0,4,0],[0,4,0],[4,4,0]];
        if (type === 'I') return [[0,5,0,0],[0,5,0,0],[0,5,0,0],[0,5,0,0]];
        if (type === 'S') return [[0,6,6],[6,6,0],[0,0,0]];
        if (type === 'Z') return [[7,7,0],[0,7,7],[0,0,0]];
    }

    const colors = [null, '#00f3ff', '#ff00ff', '#ffcf00', '#00ff00', '#ff0033', '#0066ff', '#66ff00'];

    function drawMatrix(matrix, offset, ctx) {
        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    ctx.fillStyle = colors[value];
                    ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                    ctx.lineWidth = 0.05;
                    ctx.strokeStyle = 'white';
                    ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                }
            });
        });
    }

    function draw() {
        context.fillStyle = '#000';
        context.fillRect(0, 0, 12, 20); // Sesuai grid arena
        drawMatrix(arena, {x: 0, y: 0}, context);
        drawMatrix(player.matrix, player.pos, context);
        
        nextContext.fillStyle = '#000';
        nextContext.fillRect(0, 0, 50, 50);
        nextContext.setTransform(12, 0, 0, 12, 0, 0); // Skala kecil untuk preview
        drawMatrix(player.next, {x: 0.5, y: 0.5}, nextContext);
    }

    const arena = Array.from({length: 20}, () => Array(12).fill(0));
    const player = { pos: {x: 0, y: 0}, matrix: null, next: null, score: 0 };

    function playerReset() {
        const pieces = 'ILJOTSZ';
        player.matrix = player.next || createPiece(pieces[pieces.length * Math.random() | 0]);
        player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
        player.pos.y = 0;
        player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
        if (collide(arena, player)) {
            arena.forEach(row => row.fill(0));
            player.score = 0;
            updateScore();
        }
    }

    function collide(arena, player) {
        const [m, o] = [player.matrix, player.pos];
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
            }
        }
        return false;
    }

    function rotate(matrix) {
        for (let y = 0; y < matrix.length; ++y) {
            for (let x = 0; x < y; ++x) [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
        matrix.forEach(row => row.reverse());
    }

    function playerDrop() {
        player.pos.y++;
        if (collide(arena, player)) {
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            sounds.drop();
        }
        dropCounter = 0;
    }

    function merge(arena, player) {
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
            });
        });
    }

    function arenaSweep() {
        let rowsCleared = 0;
        outer: for (let y = arena.length - 1; y > 0; --y) {
            for (let x = 0; x < arena[y].length; ++x) {
                if (arena[y][x] === 0) continue outer;
            }
            const row = arena.splice(y, 1)[0].fill(0);
            arena.unshift(row);
            ++y;
            rowsCleared++;
        }
        if (rowsCleared > 0) {
            player.score += rowsCleared * 10;
            updateScore();
            sounds.clear();
        }
    }

    function updateScore() { document.getElementById('score').innerText = player.score; }

    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;

    function update(time = 0) {
        const deltaTime = time - lastTime;
        lastTime = time;
        dropCounter += deltaTime;
        if (dropCounter > dropInterval) playerDrop();
        draw();
        requestAnimationFrame(update);
    }

    // --- KONTROL SENTUH ---
    const actions = {
        left: () => { player.pos.x--; if (collide(arena, player)) player.pos.x++; else sounds.move(); },
        right: () => { player.pos.x++; if (collide(arena, player)) player.pos.x--; else sounds.move(); },
        down: () => playerDrop(),
        rotate: () => {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix);
                    player.pos.x = pos;
                    return;
                }
            }
            sounds.rotate();
        }
    };

    // Event Handler (Universal untuk Mobile)
    const addControl = (id, action) => {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => {
            e.preventDefault();
            action();
        });
    };

    addControl('ctrl-left', actions.left);
    addControl('ctrl-right', actions.right);
    addControl('ctrl-down', actions.down);
    addControl('ctrl-up', actions.rotate);

    playerReset();
    updateScore();
    update();
</script>
</body>
</html>
